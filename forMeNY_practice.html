<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOR ME NY — Voice Practice</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=DM+Mono:wght@300;400&display=swap');

  :root {
    --bg: #0e0d0b;
    --surface: #161512;
    --surface2: #1e1c19;
    --border: #2a2820;
    --gold: #c9a84c;
    --gold-dim: #7a6330;
    --cream: #e8e0ce;
    --cream-dim: #8a8070;
    --red: #c45c3a;
    --green: #5a8a5a;
    --blue: #4a7a9b;
    --text: #d4cabb;
    --text-dim: #6b6459;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'DM Mono', monospace; font-size: 13px;
    min-height: 100vh; display: flex; flex-direction: column;
  }

  header {
    border-bottom: 1px solid var(--border);
    padding: 16px 28px; display: flex;
    justify-content: space-between; align-items: baseline; flex-shrink: 0;
  }
  .logo { font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 300; color: var(--cream); letter-spacing: 0.12em; }
  .logo span { color: var(--gold); }
  .tagline { font-size: 10px; color: var(--text-dim); letter-spacing: 0.08em; }

  .app { flex: 1; display: grid; grid-template-columns: 1fr 400px; height: calc(100vh - 53px); overflow: hidden; }

  .left {
    padding: 24px 28px; display: flex; flex-direction: column; gap: 20px;
    overflow-y: auto; border-right: 1px solid var(--border); scroll-behavior: smooth;
  }
  .left::-webkit-scrollbar { width: 3px; }
  .left::-webkit-scrollbar-thumb { background: var(--border); }

  .section-label { font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold); margin-bottom: 8px; }

  .key-row { display: flex; gap: 8px; }
  .key-input { flex: 1; background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 8px 10px; font-family: 'DM Mono', monospace; font-size: 11px; outline: none; }
  .key-input:focus { border-color: var(--gold-dim); }
  .key-save-btn { background: var(--gold); color: var(--bg); border: none; padding: 8px 14px; cursor: pointer; font-family: 'DM Mono', monospace; font-size: 10px; }
  .key-status { font-size: 10px; margin-top: 4px; color: var(--text-dim); }
  .key-status.ok { color: var(--green); }

  .lang-toggle { display: flex; border: 1px solid var(--border); width: fit-content; }
  .lang-btn { background: transparent; border: none; color: var(--text-dim); padding: 6px 16px; cursor: pointer; font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.06em; }
  .lang-btn.active { background: var(--gold); color: var(--bg); }

  /* Mode tabs */
  .mode-tabs { display: flex; gap: 0; border: 1px solid var(--border); }
  .mode-tab {
    flex: 1; background: transparent; border: none; color: var(--text-dim);
    padding: 8px 10px; cursor: pointer; font-family: 'DM Mono', monospace;
    font-size: 10px; letter-spacing: 0.06em; text-align: center; transition: all 0.15s;
    border-right: 1px solid var(--border);
  }
  .mode-tab:last-child { border-right: none; }
  .mode-tab.active { background: var(--surface2); color: var(--cream); }
  .mode-tab.active.speech { border-bottom: 2px solid var(--gold); }
  .mode-tab.active.roleplay { border-bottom: 2px solid var(--blue); }
  .mode-hint { font-size: 9px; color: var(--text-dim); margin-top: 5px; }

  /* Topic grid */
  .topic-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .topic-btn {
    background: var(--surface); border: 1px solid var(--border); color: var(--cream-dim);
    padding: 9px 10px; cursor: pointer; font-family: 'DM Mono', monospace;
    font-size: 10px; text-align: left; line-height: 1.4; transition: all 0.15s;
  }
  .topic-btn:hover { border-color: var(--gold-dim); color: var(--cream); }
  .topic-btn.active { border-color: var(--gold); color: var(--gold); background: rgba(201,168,76,0.06); }
  .topic-btn.roleplay-btn.active { border-color: var(--blue); color: #7aaabb; background: rgba(74,122,155,0.06); }
  .topic-tag { font-size: 8px; color: var(--text-dim); display: block; margin-top: 2px; }

  .custom-input {
    width: 100%; background: var(--surface); border: 1px solid var(--border); color: var(--text);
    padding: 9px 10px; font-family: 'DM Mono', monospace; font-size: 11px;
    outline: none; resize: vertical; min-height: 52px; margin-top: 6px;
  }
  .custom-input:focus { border-color: var(--gold-dim); }

  /* Roleplay context info */
  .roleplay-info {
    background: rgba(74,122,155,0.08);
    border: 1px solid rgba(74,122,155,0.25);
    padding: 10px 12px;
    font-size: 10px;
    color: #7aaabb;
    line-height: 1.6;
    display: none;
  }
  .roleplay-info.visible { display: block; }

  /* Record area */
  .record-area { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px 0; }
  .timer { font-family: 'Cormorant Garamond', serif; font-size: 38px; font-weight: 300; color: var(--cream-dim); letter-spacing: 0.04em; }
  .timer.active { color: var(--cream); }
  .waveform { display: flex; align-items: center; gap: 3px; height: 28px; opacity: 0; transition: opacity 0.3s; }
  .waveform.visible { opacity: 1; }
  .wave-bar { width: 3px; background: var(--gold); border-radius: 2px; height: 4px; transition: height 0.1s; }
  .record-btn {
    width: 76px; height: 76px; border-radius: 50%;
    border: 2px solid var(--gold-dim); background: transparent;
    cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s;
  }
  .record-btn:hover { border-color: var(--gold); }
  .record-btn.recording { border-color: var(--red); animation: pulse 1.4s ease-in-out infinite; }
  .record-btn.recording .dot { background: var(--red); border-radius: 4px; }
  .record-btn.roleplay-mode { border-color: rgba(74,122,155,0.5); }
  .record-btn.roleplay-mode:hover { border-color: var(--blue); }
  .record-btn.roleplay-mode .dot { background: var(--blue); }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(196,92,58,0.4); } 50% { box-shadow: 0 0 0 14px rgba(196,92,58,0); } }
  .dot { width: 18px; height: 18px; border-radius: 50%; background: var(--gold); transition: all 0.2s; }
  .record-label { font-size: 10px; color: var(--text-dim); letter-spacing: 0.1em; text-align: center; }

  /* Metrics */
  .metrics-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1px; background: var(--border); border: 1px solid var(--border); opacity: 0.7; }
  .metric { background: var(--surface); padding: 10px 12px; }
  .metric-label { font-size: 8px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-dim); }
  .metric-value { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 300; color: var(--cream-dim); line-height: 1.2; margin-top: 2px; }
  .metric-unit { font-size: 9px; color: var(--text-dim); }
  .metric-bar-track { height: 2px; background: var(--border); margin-top: 5px; position: relative; }
  .metric-bar-fill { position: absolute; top: 0; left: 0; height: 100%; background: var(--gold); transition: width 0.4s ease; }
  .metric-bar-fill.ok { background: var(--green); }
  .metric-bar-fill.warn { background: var(--gold); }
  .metric-bar-fill.bad { background: var(--red); }
  .metric-ref { font-size: 8px; color: var(--text-dim); margin-top: 3px; }

  /* Transcript */
  .transcript-box {
    background: var(--surface); border: 1px solid var(--border);
    padding: 12px 14px; min-height: 70px; line-height: 1.7;
    color: var(--cream-dim); font-family: 'Cormorant Garamond', serif;
    font-size: 14px; font-style: italic;
  }
  .transcript-box.placeholder { color: var(--text-dim); font-style: normal; font-family: 'DM Mono', monospace; font-size: 11px; }

  /* Right panel */
  .right { display: flex; flex-direction: column; background: var(--surface); }
  .chat-header { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .ai-avatar { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--gold-dim); display: flex; align-items: center; justify-content: center; font-family: 'Cormorant Garamond', serif; font-size: 12px; color: var(--gold); }
  .ai-avatar.roleplay { border-color: rgba(74,122,155,0.5); color: #7aaabb; }
  .chat-header-text { font-size: 10px; color: var(--cream-dim); }
  .phase-badge { margin-left: auto; font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; padding: 3px 8px; border: 1px solid var(--border); color: var(--text-dim); }
  .phase-badge.prepare { border-color: var(--gold-dim); color: var(--gold); }
  .phase-badge.rehearse { border-color: #4a7a9b; color: #7aaabb; }
  .phase-badge.roleplay { border-color: #4a7a9b; color: #7aaabb; }
  .phase-badge.reflect { border-color: var(--green); color: var(--green); }

  .chat-messages { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
  .chat-messages::-webkit-scrollbar { width: 3px; }
  .chat-messages::-webkit-scrollbar-thumb { background: var(--border); }

  .msg { max-width: 100%; }
  .msg-role { font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 4px; }
  .msg-bubble { padding: 11px 13px; line-height: 1.7; }
  .msg.ai .msg-bubble { background: var(--surface2); border-left: 2px solid var(--gold-dim); color: var(--text); font-family: 'Cormorant Garamond', serif; font-size: 15px; }
  .msg.role-player .msg-bubble { background: rgba(74,122,155,0.08); border-left: 2px solid rgba(74,122,155,0.5); color: var(--text); font-family: 'Cormorant Garamond', serif; font-size: 15px; font-style: italic; }
  .msg.user .msg-bubble { background: rgba(201,168,76,0.05); border-left: 2px solid var(--gold); color: var(--cream-dim); font-size: 12px; }

  .typing-indicator { display: flex; gap: 4px; align-items: center; padding: 6px 0; }
  .typing-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--gold-dim); animation: typingBounce 1.1s ease-in-out infinite; }
  .typing-dot:nth-child(2) { animation-delay: 0.18s; }
  .typing-dot:nth-child(3) { animation-delay: 0.36s; }
  @keyframes typingBounce { 0%,80%,100% { transform: translateY(0); opacity: 0.4; } 40% { transform: translateY(-5px); opacity: 1; } }

  .chat-input-area { border-top: 1px solid var(--border); padding: 10px 14px; display: flex; gap: 6px; flex-shrink: 0; }
  .chat-input { flex: 1; background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 8px 10px; font-family: 'DM Mono', monospace; font-size: 11px; outline: none; }
  .chat-input:focus { border-color: var(--gold-dim); }
  .chat-input::placeholder { color: var(--text-dim); }
  .send-btn { background: transparent; border: 1px solid var(--border); color: var(--gold); padding: 7px 12px; cursor: pointer; font-family: 'DM Mono', monospace; font-size: 10px; transition: all 0.15s; }
  .send-btn:hover { border-color: var(--gold); }

  ::-webkit-scrollbar { width: 3px; }
  ::-webkit-scrollbar-thumb { background: var(--border); }

  .end-roleplay-btn {
    background: transparent;
    border: 1px solid rgba(196,92,58,0.4);
    color: var(--red);
    padding: 8px 20px;
    cursor: pointer;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.08em;
    transition: all 0.15s;
  }
  .end-roleplay-btn:hover {
    border-color: var(--red);
    background: rgba(196,92,58,0.08);
  }

  /* Voice selector */
  .voice-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; }
  .voice-btn {
    background: var(--surface); border: 1px solid var(--border);
    color: var(--cream-dim); padding: 7px 6px; cursor: pointer;
    font-family: 'DM Mono', monospace; font-size: 10px;
    text-align: center; transition: all 0.15s;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  .voice-btn:hover { border-color: var(--gold-dim); color: var(--cream); }
  .voice-btn.active { border-color: #4a7a9b; color: #7aaabb; background: rgba(74,122,155,0.08); }
  .voice-tag { font-size: 8px; color: var(--text-dim); }
</style>
</head>
<body>

<header>
  <div class="logo">FOR ME <span>NY</span></div>
  <div class="tagline">Voice Practice Studio</div>
</header>

<div class="app">
  <div class="left">

    <!-- API Key -->
    <div>
      <div class="section-label">OpenAI API Key</div>
      <div class="key-row">
        <input class="key-input" id="apiKeyInput" type="password" placeholder="sk-..." />
        <button class="key-save-btn" onclick="saveKey()">保存</button>
      </div>
      <div class="key-status" id="keyStatus">未設定</div>
    </div>

    <!-- Language -->
    <div>
      <div class="section-label">Language</div>
      <div class="lang-toggle">
        <button class="lang-btn active" id="langJA" onclick="setLang('ja')">日本語</button>
        <button class="lang-btn" id="langEN" onclick="setLang('en')">English</button>
      </div>
    </div>

    <!-- AI Voice -->
    <div id="voiceSelectorSection">
      <div class="section-label">AI Voice（ロールプレイ）</div>
      <div class="voice-grid" id="voiceGrid">
        <button class="voice-btn" data-voice="nova" onclick="setVoice(this)">Nova<span class="voice-tag">女性・自然</span></button>
        <button class="voice-btn" data-voice="shimmer" onclick="setVoice(this)">Shimmer<span class="voice-tag">女性・柔らか</span></button>
        <button class="voice-btn active" data-voice="onyx" onclick="setVoice(this)">Onyx<span class="voice-tag">男性・低音</span></button>
        <button class="voice-btn" data-voice="echo" onclick="setVoice(this)">Echo<span class="voice-tag">男性・若め</span></button>
        <button class="voice-btn" data-voice="fable" onclick="setVoice(this)">Fable<span class="voice-tag">中性・若め</span></button>
        <button class="voice-btn" data-voice="alloy" onclick="setVoice(this)">Alloy<span class="voice-tag">中性・落ち着き</span></button>
      </div>
    </div>

    <!-- Mode -->
    <div>
      <div class="section-label">Mode</div>
      <div class="mode-tabs">
        <button class="mode-tab active speech" id="modeTabSpeech" onclick="setMode('speech')">🎙 スピーチ練習</button>
        <button class="mode-tab roleplay" id="modeTabRoleplay" onclick="setMode('roleplay')">🎭 ロールプレイ</button>
      </div>
      <div class="mode-hint" id="modeHint">一人で話して計測・フィードバックを受ける</div>
    </div>

    <!-- Scenarios -->
    <div>
      <div class="section-label" id="scenarioLabel">Topic / シナリオ</div>

      <!-- Speech scenarios -->
      <div id="speechScenarios">
        <div class="topic-grid">
          <button class="topic-btn active" data-topic="自己紹介（1分間）" onclick="selectTopic(this, 'speech')">自己紹介<span class="topic-tag">1分間スピーチ</span></button>
          <button class="topic-btn" data-topic="プロジェクト提案プレゼン（3分）" onclick="selectTopic(this, 'speech')">提案プレゼン<span class="topic-tag">3分間</span></button>
          <button class="topic-btn" data-topic="FOR ME NYのワークショップについて説明する" onclick="selectTopic(this, 'speech')">FOR ME NY<span class="topic-tag">ワークショップ説明</span></button>
          <button class="topic-btn" data-topic="AIと人間の共存についての意見を述べる" onclick="selectTopic(this, 'speech')">AI × 人間<span class="topic-tag">意見スピーチ</span></button>
        </div>
        <textarea class="custom-input" id="customTopicSpeech" placeholder="カスタムトピックを入力…" oninput="onCustomTopic('speech')"></textarea>
      </div>

      <!-- Roleplay scenarios -->
      <div id="roleplaysScenarios" style="display:none">
        <div class="topic-grid">
          <button class="topic-btn roleplay-btn" data-role="上司" data-situation="部下が上司に新しいプロジェクトのアイデアを提案している。上司は多忙で懐疑的だが話を聞く姿勢はある" data-opener="「少しお時間よろしいですか？提案があるのですが」" onclick="selectRoleplay(this)">上司へ提案<span class="topic-tag">アイデアを売り込む</span></button>
          <button class="topic-btn roleplay-btn" data-role="面接官" data-situation="就職・転職面接。面接官はプロフェッショナルで、鋭い質問をするが圧迫ではない" data-opener="「では自己紹介からお願いできますか」" onclick="selectRoleplay(this)">面接<span class="topic-tag">自己PRと質疑応答</span></button>
          <button class="topic-btn roleplay-btn" data-role="教授・指導教員" data-situation="学生が教授に研究の方向性や進捗を報告・相談している。教授は厳格だが学生思い" data-opener="「今日は研究の進捗を聞かせてください」" onclick="selectRoleplay(this)">教授へ相談<span class="topic-tag">研究・学習の報告</span></button>
          <button class="topic-btn roleplay-btn" data-role="クライアント（初対面）" data-situation="初めて会うクライアントへのサービス説明。クライアントはまだ信頼を持っておらず、質問が多い" data-opener="「本日はお時間いただきありがとうございます」" onclick="selectRoleplay(this)">クライアント<span class="topic-tag">初対面・サービス説明</span></button>
          <button class="topic-btn roleplay-btn" data-role="意見が対立するチームメンバー" data-situation="チーム内で方向性の意見が対立している。感情的にならず、相手の意見も尊重しながら自分の立場を伝える必要がある" data-opener="「少し話し合いたいことがあって」" onclick="selectRoleplay(this)">意見対立<span class="topic-tag">対話・交渉</span></button>
          <button class="topic-btn roleplay-btn" data-role="昇給交渉の相手（人事・上司）" data-situation="昇給・待遇改善の交渉。相手は会社の立場を守りながらも、合理的な理由があれば検討する姿勢" data-opener="「今後のキャリアと待遇についてお話ししたいのですが」" onclick="selectRoleplay(this)">昇給交渉<span class="topic-tag">待遇・キャリア</span></button>
        </div>
        <textarea class="custom-input" id="customTopicRoleplay" placeholder="カスタムシナリオを入力（例：医師への症状説明）…" oninput="onCustomTopic('roleplay')"></textarea>
      </div>

      <!-- Roleplay context display -->
      <div class="roleplay-info" id="roleplaysInfo"></div>
    </div>

    <!-- Record -->
    <div class="record-area">
      <div class="timer" id="timer">0:00</div>
      <div class="waveform" id="waveform">
        <div class="wave-bar" id="wb0"></div><div class="wave-bar" id="wb1"></div>
        <div class="wave-bar" id="wb2"></div><div class="wave-bar" id="wb3"></div>
        <div class="wave-bar" id="wb4"></div><div class="wave-bar" id="wb5"></div>
        <div class="wave-bar" id="wb6"></div><div class="wave-bar" id="wb7"></div>
      </div>
      <button class="record-btn" id="recordBtn" onclick="toggleRecord()">
        <div class="dot" id="dot"></div>
      </button>
      <div class="record-label" id="recordLabel">クリックして録音開始</div>
      <div id="aiSpeakingIndicator" style="display:none;align-items:center;gap:8px;font-size:10px;color:#7aaabb;">
        <div class="typing-indicator"><div class="typing-dot" style="background:#4a7a9b"></div><div class="typing-dot" style="background:#4a7a9b"></div><div class="typing-dot" style="background:#4a7a9b"></div></div>
        <span id="aiSpeakingLabel">相手が話しています…</span>
      </div>
      <button class="end-roleplay-btn" id="endRoleplaysBtn" style="display:none" onclick="endRoleplay()">ロールプレイを終了する</button>
    </div>

    <!-- Metrics (speech mode only, compact) -->
    <div class="metrics-row" id="metricsRow" style="display:none">
      <div class="metric">
        <div class="metric-label">Speed</div>
        <div class="metric-value" id="speedVal">—</div>
        <div class="metric-unit" id="speedUnit">chars/min</div>
        <div class="metric-bar-track"><div class="metric-bar-fill" id="speedBar" style="width:0%"></div></div>
        <div class="metric-ref" id="speedHint">目安 350–400</div>
      </div>
      <div class="metric">
        <div class="metric-label">Pauses</div>
        <div class="metric-value" id="pauseVal">—</div>
        <div class="metric-unit">回</div>
        <div class="metric-bar-track"><div class="metric-bar-fill" id="pauseBar" style="width:0%"></div></div>
        <div class="metric-ref">有意な間</div>
      </div>
      <div class="metric">
        <div class="metric-label">Volume</div>
        <div class="metric-value" id="volVal">—</div>
        <div class="metric-unit">dB avg</div>
        <div class="metric-bar-track"><div class="metric-bar-fill" id="volBar" style="width:0%"></div></div>
        <div class="metric-ref">音量安定度</div>
      </div>
    </div>

    <!-- Transcript -->
    <div id="transcriptSection" style="display:none">
      <div class="section-label">Transcript</div>
      <div class="transcript-box placeholder" id="transcriptBox">録音後にここにテキストが表示されます</div>
    </div>

  </div>

  <!-- RIGHT PANEL -->
  <div class="right">
    <div class="chat-header">
      <div class="ai-avatar" id="aiAvatar">F</div>
      <div class="chat-header-text" id="chatHeaderText">FOR ME NY AI Coach</div>
      <div class="phase-badge" id="phaseBadge">—</div>
    </div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input-area">
      <input class="chat-input" id="chatInput" placeholder="ここに入力…" onkeydown="if(event.key==='Enter')sendMessage()" />
      <button class="send-btn" onclick="sendMessage()">送信</button>
    </div>
  </div>
</div>

<script>
// ── State ──────────────────────────────────────────
let apiKey = localStorage.getItem('formeny_openai_key') || '';
let lang = 'ja';
let mode = 'speech'; // 'speech' | 'roleplay'
let selectedTopic = '自己紹介（1分間）';
let selectedRoleplay = null; // { role, situation, opener }

let isRecording = false;
let isStarting = false;
let recognition = null;
let timerInterval = null;
let startTime = null;
let fullTranscript = '';
let lastSpeechTime = null;
let silenceEvents = [];
let currentSilenceStart = null;
const SILENCE_THRESHOLD = 0.8;
let volumeSamples = [];
let audioContext = null, analyser = null, micStream = null;
let animFrameId = null;
let pendingComputeTimer = null;

let chatHistory = []; // coach conversation
let roleplaysHistory = []; // roleplay conversation (separate)
let lastMetrics = null;
let phase = 'prepare'; // 'prepare' | 'rehearse' | 'roleplay' | 'reflect'
let prepareAnswered = false;
let roleplaysRoundCount = 0;

// ── Init ──────────────────────────────────────────
if (apiKey) {
  document.getElementById('apiKeyInput').value = '••••••••';
  document.getElementById('keyStatus').textContent = '設定済み ✓';
  document.getElementById('keyStatus').className = 'key-status ok';
}
setTimeout(() => startPrepare(), 400);

// ── Mode switching ──────────────────────────────────────────
function setMode(m) {
  mode = m;
  document.getElementById('modeTabSpeech').className = 'mode-tab' + (m === 'speech' ? ' active speech' : '');
  document.getElementById('modeTabRoleplay').className = 'mode-tab' + (m === 'roleplay' ? ' active roleplay' : '');
  document.getElementById('speechScenarios').style.display = m === 'speech' ? 'block' : 'none';
  document.getElementById('roleplaysScenarios').style.display = m === 'roleplay' ? 'block' : 'none';
  document.getElementById('roleplaysInfo').classList.remove('visible');
  document.getElementById('modeHint').textContent = m === 'speech'
    ? '一人で話して計測・フィードバックを受ける'
    : 'AIが相手役になりきってリアルな対話を練習する';
  document.getElementById('scenarioLabel').textContent = m === 'speech' ? 'Topic / シナリオ' : 'ロールプレイ シナリオ';

  const btn = document.getElementById('recordBtn');
  if (m === 'roleplay') {
    btn.classList.add('roleplay-mode');
    document.getElementById('recordLabel').textContent = 'クリックして話す（録音）';
  } else {
    btn.classList.remove('roleplay-mode');
    document.getElementById('recordLabel').textContent = 'クリックして録音開始';
  }

  // Reset if no roleplay selected
  if (m === 'roleplay' && !selectedRoleplay) {
    // prompt user to pick a scenario
  }
}

function selectTopic(btn, m) {
  document.querySelectorAll('#speechScenarios .topic-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  selectedTopic = btn.dataset.topic;
  document.getElementById('customTopicSpeech').value = '';
}

function selectRoleplay(btn) {
  document.querySelectorAll('#roleplaysScenarios .topic-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  selectedRoleplay = {
    role: btn.dataset.role,
    situation: btn.dataset.situation,
    opener: btn.dataset.opener
  };
  document.getElementById('customTopicRoleplay').value = '';
  const info = document.getElementById('roleplaysInfo');
  info.textContent = `相手役：${selectedRoleplay.role} / ${selectedRoleplay.situation}`;
  info.classList.add('visible');
}

function onCustomTopic(m) {
  if (m === 'speech') {
    const v = document.getElementById('customTopicSpeech').value.trim();
    if (v) { document.querySelectorAll('#speechScenarios .topic-btn').forEach(b => b.classList.remove('active')); selectedTopic = v; }
  } else {
    const v = document.getElementById('customTopicRoleplay').value.trim();
    if (v) {
      document.querySelectorAll('#roleplaysScenarios .topic-btn').forEach(b => b.classList.remove('active'));
      selectedRoleplay = { role: 'カスタム相手', situation: v, opener: 'では始めましょう。' };
      const info = document.getElementById('roleplaysInfo');
      info.textContent = `シナリオ：${v}`;
      info.classList.add('visible');
    }
  }
}

// ── Phase management ──────────────────────────────────────────
function startPrepare() {
  setPhase('prepare');
  const q = `ようこそ。ここはあなたが自分の声を、安心して探求できる場所です。\n\n今日はどちらで練習しますか？スピーチ練習なら左上のトピックを選んで、ロールプレイなら「ロールプレイ」タブからシナリオを選んでください。\n\n録音を始める前に、今この瞬間の気持ちを少し聞かせてください。`;
  addCoachMessage(q);
  document.getElementById('chatInput').placeholder = '気持ちを教えてください…';
}

function setPhase(p) {
  phase = p;
  const badge = document.getElementById('phaseBadge');
  const labels = { prepare: 'Prepare', rehearse: 'Rehearse', roleplay: 'Role Play', reflect: 'Reflect' };
  badge.textContent = labels[p] || '—';
  badge.className = 'phase-badge ' + p;
}

// ── Recording ──────────────────────────────────────────
async function toggleRecord() {
  if (isRecording) {
    stopRecording();
  } else {
    if (mode === 'roleplay' && !selectedRoleplay) {
      addCoachMessage('まずロールプレイのシナリオを選んでください。');
      return;
    }
    // Don't start recording while AI audio is playing
    if (currentAudio && !currentAudio.paused) {
      addCoachMessage('相手が話し終わるまでお待ちください。');
      return;
    }
    if (isStarting) return;
    isStarting = true;
    try { await startRecording(); } finally { isStarting = false; }
  }
}

async function startRecording() {
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    alert('このブラウザはWeb Speech APIに対応していません。Chromeをお使いください。');
    return;
  }

  fullTranscript = '';
  silenceEvents = [];
  volumeSamples = [];
  lastSpeechTime = null;
  currentSilenceStart = null;
  animFrameId = null;

  if (mode === 'speech') {
    setPhase('rehearse');
    if (!prepareAnswered) {
      addCoachMessage(`「${selectedTopic}」について、自由に話してください。正解はありません。`);
    } else {
      addCoachMessage(`「${selectedTopic}」について話してください。自分のペースで。`);
    }
    document.getElementById('transcriptSection').style.display = 'block';
  } else {
    // roleplay mode: just record, scene was already set up
    setPhase('roleplay');
    if (roleplaysRoundCount === 0) {
      // First button press = set up scene, don't start recording yet
      isStarting = false; // release lock
      await startRoleplaysScene();
      return; // recording will start on next button press
    }
    // 2nd press onwards: normal recording
  }

  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioContext.createAnalyser();
    analyser.fftSize = 256;
    audioContext.createMediaStreamSource(micStream).connect(analyser);
    startVolumeTracking();
  } catch(e) { /* volume optional */ }

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.lang = lang === 'ja' ? 'ja-JP' : 'en-US';

  recognition.onresult = (e) => {
    const now = Date.now();
    if (currentSilenceStart !== null) {
      const dur = (now - currentSilenceStart) / 1000;
      if (dur >= SILENCE_THRESHOLD) silenceEvents.push({ duration: dur });
      currentSilenceStart = null;
    }
    lastSpeechTime = now;
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) fullTranscript += e.results[i][0].transcript + ' ';
      else interim = e.results[i][0].transcript;
    }
    updateTranscriptDisplay(fullTranscript + interim);
  };
  recognition.onspeechend = () => { currentSilenceStart = Date.now(); };
  recognition.onerror = (e) => { if (e.error !== 'no-speech') console.warn('SR:', e.error); };
  recognition.onend = () => { if (isRecording) recognition.start(); };
  recognition.start();

  isRecording = true;
  pendingComputeTimer = null;
  startTime = Date.now();

  const btn = document.getElementById('recordBtn');
  btn.classList.add('recording');
  document.getElementById('dot').style.borderRadius = '4px';
  document.getElementById('recordLabel').textContent = mode === 'roleplay' ? 'クリックして停止（相手に渡す）' : 'クリックして停止';
  document.getElementById('waveform').classList.add('visible');

  timerInterval = setInterval(() => {
    const el = Math.floor((Date.now() - startTime) / 1000);
    document.getElementById('timer').textContent = `${Math.floor(el/60)}:${(el%60).toString().padStart(2,'0')}`;
    document.getElementById('timer').classList.add('active');
    if (lastSpeechTime && currentSilenceStart === null && (Date.now() - lastSpeechTime) / 1000 > SILENCE_THRESHOLD) {
      currentSilenceStart = lastSpeechTime + SILENCE_THRESHOLD * 1000;
    }
  }, 500);
}

function stopRecording() {
  isRecording = false;
  // Fully kill recognition to prevent ghost restarts
  if (recognition) {
    recognition.onend = null;
    recognition.onresult = null;
    recognition.onerror = null;
    recognition.onspeechend = null;
    try { recognition.stop(); } catch(e) {}
    recognition = null;
  }
  if (timerInterval) clearInterval(timerInterval);
  if (animFrameId !== null) { cancelAnimationFrame(animFrameId); animFrameId = -1; }
  if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  if (audioContext) { audioContext.close(); audioContext = null; }

  document.getElementById('recordBtn').classList.remove('recording');
  document.getElementById('dot').style.borderRadius = '50%';
  document.getElementById('timer').classList.remove('active');
  document.getElementById('waveform').classList.remove('visible');

  const snapStart = startTime;
  const snapTranscript = fullTranscript;

  if (mode === 'speech') {
    document.getElementById('recordLabel').textContent = 'クリックして再録音';
    pendingComputeTimer = setTimeout(() => {
      pendingComputeTimer = null;
      computeMetrics(snapStart, snapTranscript);
      setTimeout(() => document.getElementById('metricsRow').scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 150);
      setTimeout(() => startReflect(), 600);
    }, 800);
  } else {
    // Roleplay: send user's speech to AI character
    document.getElementById('recordLabel').textContent = 'AIが返答しています…';
    document.getElementById('recordBtn').disabled = true;
    pendingComputeTimer = setTimeout(() => {
      pendingComputeTimer = null;
      const userSpeech = snapTranscript.trim();
      // Even if empty, send a short placeholder so AI responds
      handleRoleplaysUserTurn(userSpeech || '（沈黙）');
    }, 800);
  }
}

// ── Roleplay logic ──────────────────────────────────────────
async function startRoleplaysScene() {
  roleplaysHistory = [];
  roleplaysRoundCount = 0;

  document.getElementById('aiAvatar').textContent = selectedRoleplay.role[0];
  document.getElementById('aiAvatar').className = 'ai-avatar roleplay';
  document.getElementById('chatHeaderText').textContent = selectedRoleplay.role + ' 役';
  document.getElementById('endRoleplaysBtn').style.display = 'block';

  addCoachMessage(`シナリオ：${selectedRoleplay.role}\n\n${selectedRoleplay.situation}\n\nAIが最初に話しかけます。話し終わったら録音ボタンを押して返答してください。`);

  showTyping();
  try {
    const opener = await callOpenAI([
      { role: 'user', content: 'シーンを開始してください。オープニングの一言を言ってください。' }
    ], buildRoleplaysSystemPrompt());
    hideTyping();
    addRoleMessage(opener);
    roleplaysHistory.push({ role: 'assistant', content: opener });
    roleplaysRoundCount++;
    // Speak opener — after speech ends, user can record
    speakAsRole(opener, () => {
      document.getElementById('recordLabel').textContent = 'クリックして返答（録音）';
    });
  } catch(e) {
    hideTyping();
    addRoleMessage(selectedRoleplay.opener);
    roleplaysHistory.push({ role: 'assistant', content: selectedRoleplay.opener });
    roleplaysRoundCount++;
    speakAsRole(selectedRoleplay.opener, () => {
      document.getElementById('recordLabel').textContent = 'クリックして返答（録音）';
    });
  }
}

async function handleRoleplaysUserTurn(userSpeech) {
  addUserMessage(userSpeech);
  roleplaysHistory.push({ role: 'user', content: userSpeech });
  roleplaysRoundCount++;

  showTyping();
  try {
    const reply = await callOpenAI(roleplaysHistory, buildRoleplaysSystemPrompt());
    hideTyping();
    addRoleMessage(reply);
    roleplaysHistory.push({ role: 'assistant', content: reply });
    // Speak reply — after speech ends, enable recording again
    speakAsRole(reply, () => {
      document.getElementById('recordLabel').textContent = 'クリックして返答（録音）';
    });
  } catch(e) {
    hideTyping();
    addCoachMessage('通信エラーが発生しました。もう一度お試しください。');
    document.getElementById('recordBtn').disabled = false;
  }
}

function buildRoleplaysSystemPrompt() {
  return `あなたは「${selectedRoleplay.role}」を演じています。

シナリオ：${selectedRoleplay.situation}

演じ方のルール：
- リアルだが圧迫しない。緊張感はあるが練習できる安心感を保つ
- 返答は1〜2文の短め。テンポよく会話のキャッチボールを続ける
- コーチや評価者としてのコメントは一切しない。キャラクターとして返すだけ
- 必ず最後に短い質問や反応を加えて相手に返す
  例：「なるほど。それで、具体的なスケジュールはどう考えてる？」
  例：「ふむ。コストはどのくらいを想定しているの？」
- 日本語で返答する
- 音声で読まれるので、記号や箇条書きは使わず自然な話し言葉で`;
}

async function startRoleplaysReflect() {
  setPhase('reflect');
  document.getElementById('recordLabel').textContent = 'クリックして録音開始';
  // Build a summary from roleplay history for the coach
  const summary = roleplaysHistory.map(m => `${m.role === 'user' ? 'あなた' : selectedRoleplay.role}：${m.content}`).join('\n');
  const q = `ロールプレイお疲れ様でした。${roleplaysRoundCount}往復の対話でした。\n\nまず、やってみてどうでしたか？どんな瞬間が難しかったですか、あるいは手応えを感じましたか？`;
  addCoachMessage(q);
  document.getElementById('chatInput').placeholder = '感じたことを教えてください…';
  // Store for reflect
  lastMetrics = { roleplaysHistory: roleplaysHistory, roleplaysRole: selectedRoleplay.role, roleplaysRounds: roleplaysRoundCount, isRoleplay: true };
}

// ── Speech Synthesis — OpenAI TTS HD ──────────────────────────────────────────
let currentAudio = null;
let onSpeechEndCallback = null;
let selectedVoice = 'onyx'; // default: 男性・低音

async function speakAsRole(text, onEnd) {
  onSpeechEndCallback = onEnd || null;
  // Stop any ongoing audio
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }

  const ind = document.getElementById('aiSpeakingIndicator');
  const label = document.getElementById('aiSpeakingLabel');
  const recordBtn = document.getElementById('recordBtn');
  if (ind) { ind.style.display = 'flex'; label.textContent = (selectedRoleplay?.role || 'AI') + 'が話しています…'; }
  recordBtn.disabled = true;

  try {
    const resp = await fetch('https://api.openai.com/v1/audio/speech', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKey },
      body: JSON.stringify({
        model: 'tts-1-hd',
        input: text,
        voice: selectedVoice,
        speed: 1.0
      })
    });

    if (!resp.ok) throw new Error('TTS failed: ' + resp.status);

    const blob = await resp.blob();
    const url = URL.createObjectURL(blob);
    const audio = new Audio(url);
    currentAudio = audio;

    audio.onended = () => {
      URL.revokeObjectURL(url);
      currentAudio = null;
      if (ind) ind.style.display = 'none';
      recordBtn.disabled = false;
      if (onSpeechEndCallback) { onSpeechEndCallback(); onSpeechEndCallback = null; }
    };
    audio.onerror = () => {
      currentAudio = null;
      if (ind) ind.style.display = 'none';
      recordBtn.disabled = false;
      if (onSpeechEndCallback) { onSpeechEndCallback(); onSpeechEndCallback = null; }
    };
    audio.play();

  } catch(e) {
    console.warn('TTS error:', e);
    if (ind) ind.style.display = 'none';
    recordBtn.disabled = false;
    if (onSpeechEndCallback) { onSpeechEndCallback(); onSpeechEndCallback = null; }
  }
}

// ── End roleplay button ──────────────────────────────────────────
function endRoleplay() {
  // Stop any playing audio
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  onSpeechEndCallback = null;
  // Stop recording if active
  if (isRecording) stopRecording();

  document.getElementById('endRoleplaysBtn').style.display = 'none';
  document.getElementById('aiSpeakingIndicator').style.display = 'none';
  document.getElementById('recordBtn').disabled = false;

  document.getElementById('aiAvatar').textContent = 'F';
  document.getElementById('aiAvatar').className = 'ai-avatar';
  document.getElementById('chatHeaderText').textContent = 'FOR ME NY AI Coach';

  setTimeout(() => startRoleplaysReflect(), 200);
}
function startReflect() {
  setPhase('reflect');
  addCoachMessage(`話し終えました。\n\nまず聞かせてください。今、どんな感覚がありますか？話してみてどうでしたか？`);
  document.getElementById('chatInput').placeholder = '感じたことを教えてください…';
}

// ── Volume tracking ──────────────────────────────────────────
function startVolumeTracking() {
  const buf = new Uint8Array(analyser.frequencyBinCount);
  function tick() {
    if (animFrameId === -1) return;
    analyser.getByteFrequencyData(buf);
    const avg = buf.reduce((a,b) => a+b, 0) / buf.length;
    volumeSamples.push(avg);
    for (let i = 0; i < 8; i++) document.getElementById('wb'+i).style.height = (4 + Math.random() * avg * 0.5) + 'px';
    animFrameId = requestAnimationFrame(tick);
  }
  animFrameId = 0;
  tick();
}

// ── Metrics (speech mode) ──────────────────────────────────────────
function computeMetrics(snapStart, snapTranscript) {
  const usedStart = snapStart !== undefined ? snapStart : startTime;
  const usedTranscript = (snapTranscript !== undefined ? snapTranscript : fullTranscript).trim();
  const elapsed = (Date.now() - usedStart) / 1000 / 60;

  if (!usedTranscript) {
    document.getElementById('transcriptBox').textContent = '（音声が認識されませんでした。マイクの許可を確認してください）';
    document.getElementById('transcriptBox').className = 'transcript-box placeholder';
    return;
  }

  let speed, speedPct, speedClass;
  if (lang === 'ja') {
    speed = Math.round(usedTranscript.replace(/\s/g,'').length / elapsed);
    speedPct = Math.min(100, (speed / 500) * 100);
    speedClass = speed >= 350 && speed <= 400 ? 'ok' : speed < 300 || speed > 480 ? 'bad' : 'warn';
  } else {
    speed = Math.round(usedTranscript.split(/\s+/).filter(w=>w).length / elapsed);
    speedPct = Math.min(100, (speed / 200) * 100);
    speedClass = speed >= 130 && speed <= 150 ? 'ok' : speed < 100 || speed > 180 ? 'bad' : 'warn';
  }

  const pauseCount = silenceEvents.filter(s => s.duration >= SILENCE_THRESHOLD).length;
  const pausePct = Math.min(100, (pauseCount / 10) * 100);
  const pauseClass = pauseCount >= 2 && pauseCount <= 8 ? 'ok' : pauseCount < 2 ? 'warn' : 'bad';

  let volDB = 0, volClass = 'ok', volNorm = 0;
  if (volumeSamples.length > 0) {
    const va = volumeSamples.reduce((a,b)=>a+b,0) / volumeSamples.length;
    volNorm = Math.min(100, (va / 80) * 100);
    const vv = volumeSamples.reduce((a,b)=>a+Math.pow(b-va,2),0)/volumeSamples.length;
    volClass = volNorm > 30 && vv < 800 ? 'ok' : volNorm < 20 ? 'warn' : 'bad';
    volDB = va > 0 ? Math.round(20 * Math.log10(va / 255) + 60) : 0;
  }

  document.getElementById('speedVal').textContent = speed;
  document.getElementById('speedBar').style.width = speedPct + '%';
  document.getElementById('speedBar').className = 'metric-bar-fill ' + speedClass;
  document.getElementById('pauseVal').textContent = pauseCount;
  document.getElementById('pauseBar').style.width = pausePct + '%';
  document.getElementById('pauseBar').className = 'metric-bar-fill ' + pauseClass;
  document.getElementById('volVal').textContent = volDB;
  document.getElementById('volBar').style.width = volNorm + '%';
  document.getElementById('volBar').className = 'metric-bar-fill ' + volClass;
  document.getElementById('metricsRow').style.display = 'grid';

  updateTranscriptDisplay(usedTranscript);

  lastMetrics = {
    isRoleplay: false,
    transcript: usedTranscript, speed, speedClass,
    pauseCount, pauseClass, volDB, volClass,
    durationMin: elapsed, lang, topic: selectedTopic
  };
}

function updateTranscriptDisplay(text) {
  const box = document.getElementById('transcriptBox');
  box.className = 'transcript-box';
  box.textContent = text || '（認識中…）';
}

// ── OpenAI ──────────────────────────────────────────
async function callOpenAI(messages, systemPrompt) {
  const resp = await fetch('https://api.openai.com/v1/chat/completions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKey },
    body: JSON.stringify({ model: 'gpt-4o', max_tokens: 600, messages: [{ role: 'system', content: systemPrompt }, ...messages] })
  });
  const data = await resp.json();
  if (data.error) throw new Error(data.error.message);
  return data.choices[0].message.content;
}

async function sendMessage() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;
  if (!apiKey) { addCoachMessage('APIキーを設定してください。'); return; }
  input.value = '';

  addUserMessage(text);
  chatHistory.push({ role: 'user', content: text });
  if (phase === 'prepare') prepareAnswered = true;

  showTyping();
  try {
    const reply = await callOpenAI(chatHistory, buildCoachSystemPrompt());
    hideTyping();
    chatHistory.push({ role: 'assistant', content: reply });
    addCoachMessage(reply);
  } catch(e) {
    hideTyping();
    addCoachMessage('通信エラーが発生しました。APIキーとネットワーク接続を確認してください。');
    chatHistory.pop();
  }
}

function buildCoachSystemPrompt() {
  const base = `あなたはFOR ME NYのAIコーチです。FOR ME NYはインプロビゼーション×心理的安全性×感情知性を大切にする表現教育メソッドです。

核心原則：
- 評価より「気づき」を促す問いかけを優先する
- 数値は気づきのきっかけとして添えるだけ。判定や採点はしない
- 「正解はない」「あなたの声には固有の価値がある」という姿勢を常に保つ
- 改善点は「次にやってみること」として1つだけ、柔らかく提案する
- フィードバックは問いかけを交えた対話形式で行う
- 返答は日本語で200〜400文字程度。簡潔に、温かく。`;

  if (phase === 'prepare') {
    return base + `\n\n現在はPrepareフェーズ。ユーザーの気持ちを受け止め、安心感を作ってください。最後に「いつでも始めてください」と伝えてください。`;
  }
  if (phase === 'reflect' && lastMetrics) {
    if (lastMetrics.isRoleplay) {
      const hist = lastMetrics.roleplaysHistory || [];
      const summary = hist.slice(0,6).map(m => `${m.role === 'user' ? 'あなた' : lastMetrics.roleplaysRole}：「${m.content.slice(0,60)}${m.content.length>60?'…':''}」`).join('\n');
      return base + `\n\n現在はReflectフェーズ（ロールプレイ後）。

ロールプレイ概要：
- 相手役：${lastMetrics.roleplaysRole}
- 往復数：${lastMetrics.roleplaysRounds}回
- 対話抜粋：\n${summary}

進め方：
1. ユーザーの感想をしっかり受け止める
2. 対話の中で気づきを促す問いを1つ投げかける（例：「一番難しかった瞬間はどこでしたか？」「相手の反応で意外だったことはありましたか？」）
3. 「次にやってみること」を1つ提案する`;
    } else {
      const m = lastMetrics;
      return base + `\n\n現在はReflectフェーズ（スピーチ後）。

録音データ（参考。押しつけない）：
- トピック：${m.topic}
- スピード：${m.speed}字/分（目安350〜400）
- 間：${m.pauseCount}回
- 書き起こし抜粋：「${m.transcript.slice(0,150)}${m.transcript.length>150?'…':''}」

進め方：
1. ユーザーの感想を受け止める
2. 書き起こしや数値から気づきを促す問いを1つ投げかける
3. 数値は「〜という数字が出ました。どう感じますか？」と問いかける形で
4. 「次にやってみること」を1つだけ提案する`;
    }
  }
  return base;
}

// ── Chat UI ──────────────────────────────────────────
function addCoachMessage(text) {
  const el = document.createElement('div');
  el.className = 'msg ai';
  el.innerHTML = `<div class="msg-role">AI Coach</div><div class="msg-bubble">${escHtml(text).replace(/\n/g,'<br>')}</div>`;
  document.getElementById('chatMessages').appendChild(el);
  el.scrollIntoView({ behavior: 'smooth' });
}

function addRoleMessage(text) {
  const el = document.createElement('div');
  el.className = 'msg role-player';
  const role = selectedRoleplay ? selectedRoleplay.role : 'AI';
  el.innerHTML = `<div class="msg-role">${escHtml(role)}</div><div class="msg-bubble">${escHtml(text).replace(/\n/g,'<br>')}</div>`;
  document.getElementById('chatMessages').appendChild(el);
  el.scrollIntoView({ behavior: 'smooth' });
}

function addUserMessage(text) {
  const el = document.createElement('div');
  el.className = 'msg user';
  el.innerHTML = `<div class="msg-role">You</div><div class="msg-bubble">${escHtml(text)}</div>`;
  document.getElementById('chatMessages').appendChild(el);
  el.scrollIntoView({ behavior: 'smooth' });
}

let typingEl = null;
function showTyping() {
  typingEl = document.createElement('div');
  typingEl.className = 'msg ai';
  typingEl.id = 'typingIndicator';
  typingEl.innerHTML = `<div class="msg-role">…</div><div class="msg-bubble"><div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div></div>`;
  document.getElementById('chatMessages').appendChild(typingEl);
  typingEl.scrollIntoView({ behavior: 'smooth' });
}
function hideTyping() { const el = document.getElementById('typingIndicator'); if (el) el.remove(); }

function saveKey() {
  const val = document.getElementById('apiKeyInput').value.trim();
  if (!val || val === '••••••••') return;
  apiKey = val;
  localStorage.setItem('formeny_openai_key', val);
  document.getElementById('apiKeyInput').value = '••••••••';
  document.getElementById('keyStatus').textContent = '設定済み ✓';
  document.getElementById('keyStatus').className = 'key-status ok';
}

function setVoice(btn) {
  document.querySelectorAll('.voice-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  selectedVoice = btn.dataset.voice;
}

function setLang(l) {
  lang = l;
  document.getElementById('langJA').classList.toggle('active', l === 'ja');
  document.getElementById('langEN').classList.toggle('active', l === 'en');
  document.getElementById('speedHint').textContent = l === 'ja' ? '目安 350–400' : 'target 130–150';
  document.getElementById('speedUnit').textContent = l === 'ja' ? 'chars/min' : 'words/min';
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
